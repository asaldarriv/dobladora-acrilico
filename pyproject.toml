[project]
name = "tdg-dobladora"
version = "0.1.0"
description = "Trabajo de grado: dobladora automática de acrílico — Ingeniería Física, Universidad EAFIT"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Alexander Saldarriaga Vélez", email = "alexvelez2301@gmail.com" }]
dependencies = [
    "pypdf>=5.1",
]

[project.optional-dependencies]
# Instalar con:  uv sync --extra analisis
analisis = [
    "numpy>=2.1",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "scipy>=1.14",
]

[project.scripts]
tdg = "tdg.cli:main"

[dependency-groups]
dev = ["ruff>=0.8", "pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tdg"]

# =====================================================================
#  Configuración del compilador de documentos (leída por `tdg`)
# =====================================================================
[tool.tdg]
build_dir = "build"
deliverables_dir = "entregables"
autor_slug = "SaldarriagaVelez"

[tool.tdg.documents.anteproyecto]
tex = "docs/anteproyecto/main.tex"
titulo = "Anteproyecto"
# Páginas que NO cuentan para el límite del reglamento:
front_pages = 2          # portada + índice
back_pages = 1           # bibliografía
max_content_pages = 5    # límite del reglamento

[tool.tdg.documents.avance]
tex = "docs/avance/main.tex"
titulo = "Informe de avance"
front_pages = 2
back_pages = 1
max_content_pages = 0    # 0 = sin límite

[tool.tdg.documents."informe-final"]
tex = "docs/informe-final/main.tex"
titulo = "Informe final"
front_pages = 2
back_pages = 1
max_content_pages = 0

[tool.ruff]
line-length = 100
src = ["src"]
